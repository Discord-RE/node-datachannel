name: npm Publish

on:
  workflow_dispatch:
    inputs:
      linux-run-id:
        description: 'Run ID of the Build - Linux workflow run'
        required: true
        type: string
      win-run-id:
        description: 'Run ID of the Build - Win workflow run'
        required: true
        type: string
      mac-x64-run-id:
        description: 'Run ID of the Build - Mac x64 workflow run'
        required: true
        type: string
      mac-m1-run-id:
        description: 'Run ID of the Build - Mac M1 workflow run'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  npm-publish:
    name: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download Linux prebuilds
        uses: actions/download-artifact@v4
        with:
          path: tmp/linux
          run-id: ${{ inputs.linux-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Download Windows prebuilds
        uses: actions/download-artifact@v4
        with:
          path: tmp/win
          run-id: ${{ inputs.win-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Download Mac x64 prebuilds
        uses: actions/download-artifact@v4
        with:
          path: tmp/mac-x64
          run-id: ${{ inputs.mac-x64-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Download Mac arm64 prebuilds
        uses: actions/download-artifact@v4
        with:
          path: tmp/mac-arm64
          run-id: ${{ inputs.mac-m1-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assemble prebuilds
        run: |
          mkdir -p prebuilds
          find tmp -type f -exec sh -c 'for f; do rel="${f#tmp/}"; rel="${rel#*/}"; mkdir -p "prebuilds/$(dirname "$rel")"; cp "$f" "prebuilds/$rel"; done' _ {} +
          find prebuilds -type f

      - name: Build TypeScript
        run: |
          npm install --ignore-scripts --production=false
          npm run build:tsc

      - name: Publish
        run: |
          npm publish --provenance --access public --tag beta
